<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Python Universe — Сообщить об ошибке</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <nav>
        <a href="/">Главная</a> |
        <a href="/lessons">Уроки</a> |
        <a href="/report">Сообщить об ошибке</a> |
        <a href="/register">Регистрация</a>
        <span id="nav-user"></span>
    </nav>

    <div class="form-container">
        <h2>Нашли ошибку?</h2>
        <p style="text-align: center; color: var(--footer-text); margin-bottom: 20px;">
            Мы стараемся делать сайт лучше. Если вы заметили баг или неточность в уроках — напишите нам!
        </p>

        <form action="#" method="post">
            <div class="form-group">
                <label>Ваше имя:</label>
                <input type="text" name="name" placeholder="Как к вам обращаться?" required>
            </div>
            <div class="form-group">
                <label>Email для ответа:</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Описание проблемы:</label>
                <textarea name="message" rows="5" placeholder="Опишите, что именно пошло не так..." required></textarea>
            </div>
            <button type="submit">Отправить сообщение</button>
        </form>

        <div class="divider"><span>прямые контакты</span></div>

        <div style="text-align: center; font-size: 15px;">
            <p>Email: <a href="mailto:support@python-universe.ru">support@python-universe.ru</a></p>
            <p>Telegram: <a href="https://t.me/python_universe">@python_universe</a></p>
        </div>
    </div>

    <footer>
        <p>© 2026 Python Universe</p>
    </footer>
</body>
</html>
